# Static site deploy — the build/sync/invalidate mechanics live in a shared
# workflow in bitovi-platform-services, so a fix reaches every site without a
# PR per repo. This file is just the trigger and this app's own bits.
#
# bitovians is not the org the platform GitHub App is installed on, so ESO
# never pushes SITE_DEPLOY_ROLE_ARN / SITE_BUCKET / CLOUDFRONT_DISTRIBUTION_ID
# here, and `secrets: inherit` cannot see the bitovi-org secrets that the
# shared workflow uses as a fallback. This file passes the values from this
# repo's Actions variables (AWS_DEPLOY_ROLE_ARN, SITE_BUCKET,
# CLOUDFRONT_DISTRIBUTION_ID) instead. None of them is sensitive.

name: Deploy static site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: bitovi/platform-ci/.github/workflows/static-site-deploy.yml@0.0.1
    permissions:
      id-token: write
      contents: read
    with:
      build-dir: out
      verify-url: https://pto.bitovi-tools.com
      # NEXT_PUBLIC_* vars are inlined at build time.
      build-env: |
        NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    secrets:
      SITE_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

  notify:
    needs: deploy
    if: always()
    uses: ./.github/workflows/slack-notification.yml
    with:
      status: ${{ needs.deploy.result }}
      service_name: pto-web
      environment: production
      title: static site deploy
      detail: "Commit: ${{ github.sha }}"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
