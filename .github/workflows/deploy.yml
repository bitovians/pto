name: Deploy static site

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required for GitHub OIDC -> AWS AssumeRoleWithWebIdentity.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  # Next.js `next export` writes the static site to `out/`.
  BUILD_DIR: out

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # NEXT_PUBLIC_* vars are inlined at build time, so the backend URL must
        # be present here (not at runtime). Store it as an Actions variable.
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync assets to S3
        run: |
          # Long-cache immutable, fingerprinted assets.
          aws s3 sync "$BUILD_DIR" "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html"

          # Short-cache HTML so new deploys are picked up quickly.
          aws s3 sync "$BUILD_DIR" "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  notify:
    needs: deploy
    if: always()
    uses: ./.github/workflows/slack-notification.yml
    with:
      status: ${{ needs.deploy.result }}
      service_name: pto-web
      environment: production
      title: static site deploy
      detail: "Commit: ${{ github.sha }}"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
