name: Build and Deploy (Frontend)

on:
  push:
    branches: [k8s-migration]

env:
  ECR_REGISTRY: 755521597925.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: pto-tracking/pto-frontend
  AWS_REGION: us-east-1
  INFRA_REPO: bitovi/pto-tracking-infra
  DEPLOYMENT_MANIFEST: k8s/deployments/frontend-deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required if you switch to OIDC-based AWS auth later

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate with AWS ───────────────────────────────────────────────
      # Required secrets:
      #   AWS_ACCESS_KEY_ID     — IAM access key with ECR push permissions
      #   AWS_SECRET_ACCESS_KEY — corresponding secret key
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build and push image ────────────────────────────────────────────────
      # NEXT_PUBLIC_API_BASE_URL is baked into the JavaScript bundle at build
      # time by Next.js — it cannot be injected at runtime via a ConfigMap.
      # The value must be set here as a Docker build argument so that
      # `next build` embeds the correct API URL in the output bundle.
      #
      # Required secret:
      #   NEXT_PUBLIC_API_BASE_URL — full URL to the API, e.g.
      #                              http://<alb-hostname>/api
      #                              Set this in the repository secrets under
      #                              Settings → Secrets → Actions.
      - name: Build and push Docker image
        id: build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --tag "${IMAGE_URI}:${SHORT_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            -f Dockerfile \
            .

          docker push "${IMAGE_URI}:${SHORT_SHA}"
          docker push "${IMAGE_URI}:latest"

          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ── Update image tag in the infra repo ─────────────────────────────────
      # Required secret:
      #   INFRA_REPO_TOKEN — GitHub Personal Access Token (classic or fine-grained)
      #                       with "Contents: Read and Write" permission on
      #                       bitovi/pto-tracking-infra.
      - name: Load SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.INFRA_DEPLOY_KEY }}" | base64 -d > ~/.ssh/infra-deploy-key
          chmod 600 ~/.ssh/infra-deploy-key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/infra-deploy-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Update image tag in infra repo
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          git clone "git@github.com:${INFRA_REPO}.git" infra-repo
          cd infra-repo

          sed -i "s|image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:.*|image: ${IMAGE_URI}|g" \
            "${DEPLOYMENT_MANIFEST}"

          grep "image:" "${DEPLOYMENT_MANIFEST}"

          git config user.email "ci-bot@github.com"
          git config user.name "CI Bot"
          git add "${DEPLOYMENT_MANIFEST}"
          git commit -m "ci(frontend): update image tag to ${IMAGE_TAG}

          Triggered by ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin k8s-migration
