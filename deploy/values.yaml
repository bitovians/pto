# Platform app interface (bitovi-platform-services: charts/interface). One
# file describes this app to the platform.
name: pto
repo: bitovians/pto
deployBranch: master

workloads:
  main: # key "main" keeps the derived resource name "pto", no suffix —
        # required: the AWS resources below are ADOPTED under that exact name.
    kind: static-site
    domain: pto.bitovi-tools.com

infra:
  hostedZone: bitovi-tools-com
  deletionProtection: false
  # bitovians is not the org the platform GitHub App is installed on, so ESO
  # can never push CI secrets here. deploy.yml reads them from this repo's
  # own secrets instead.
  ciSecrets: false
  # Adoption of the pre-existing AWS footprint (bitovi-platform-services
  # migration, ADR 0004). Permanent — removing an entry here strips that
  # resource's external-name binding and the composition tries to create a
  # new one instead of managing the old one.
  importIds:
    certificateArn: arn:aws:acm:us-east-1:486491621059:certificate/fb6f9a70-2175-4be1-96bb-880f42392069
    distributionId: EBLYMQFBJTA6
    oacId: E1ZG6F8BHTDUEH
